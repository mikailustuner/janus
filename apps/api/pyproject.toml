[project]
name = "janus-api"
version = "0.0.0"
description = "Janus API (research prototype, not a medical device)"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "duckdb>=2.0.0",
    "fastapi>=0.162.1",
    "prometheus-client==0.25.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.15",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["janus"]

[tool.pytest.ini_options]
testpaths = ["tests", "janus"]
addopts = "-ra --strict-markers"
markers = [
  "mrgsolve: needs R with the pinned mrgsolve (own CI job; JANUS_REQUIRE_MRGSOLVE=1 makes a missing R a failure)",
  "pksim: needs R with ospsuite and a .NET 8 runtime (own CI job; JANUS_REQUIRE_PKSIM=1 makes a missing one a failure)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"**/test_*.py" = ["S101"]
# DuckDB DDL builds statements from module constants and our own table and path names only.
"janus/memory/faers_build.py" = ["S608"]
# Sentences quote the en dash of "medicine–event" (statistics review wording).
"janus/memory/messages.py" = ["RUF001"]
# Five-language word lists and texts (Turkish dotless i, typographic dashes).
"janus/notes/phrases.py" = ["RUF001"]
"tests/test_notes_*.py" = ["RUF001", "S101"]
"tests/test_faers_build_properties.py" = ["S608"]
# Generated Markdown report: long table rows and typographic dashes are content.
"janus/light/report.py" = ["E501", "RUF001"]
# Time machine: seeded random.Random for reproducible Monte Carlo and bootstrap, not secrets.
"janus/timemachine/**" = ["S311"]
"janus/onset_table/**" = ["S311"]
"tests/test_timemachine_*.py" = ["S101", "S311"]
# Simulation service: seeded random.Random (the explorer's Monte Carlo); /tmp is the container's
# tmpfs (TMPDIR of the model processes, the worker heartbeat).
"janus/simulation/**" = ["S311", "S108"]
# Queue SQL interpolates only the constant column list `_COLS`; every value is a parameter.
"janus/simulation/queue.py" = ["S311", "S108", "S608"]
"tests/test_simulation_*.py" = ["S101", "S311"]
# Model kit: generated export text (licences, README, R script) has long lines by content.
"janus/modelkit/export.py" = ["E501"]
"janus/modelkit/router.py" = ["E501"]
"janus/modelkit/reasons.py" = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["janus", "tests"]
venvPath = "."
venv = ".venv"
