[project]
name = "janus-api"
version = "0.0.0"
description = "Janus API (research prototype, not a medical device)"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "duckdb>=2.0.0",
    "fastapi>=0.162.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.15",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["janus"]

[tool.pytest.ini_options]
testpaths = ["tests", "janus"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"**/test_*.py" = ["S101"]
# DuckDB DDL builds statements from module constants and our own table and path names only.
"janus/memory/faers_build.py" = ["S608"]
# Sentences quote the en dash of "medicine–event" (statistics review wording).
"janus/memory/messages.py" = ["RUF001"]
# Five-language word lists and texts (Turkish dotless i, typographic dashes).
"janus/notes/phrases.py" = ["RUF001"]
"tests/test_notes_*.py" = ["RUF001", "S101"]
"tests/test_faers_build_properties.py" = ["S608"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["janus", "tests"]
venvPath = "."
venv = ".venv"
