# Alembic configuration (privacy spec, design §5.2). Migrations are forward-only: an applied
# revision is never edited; every revision has a downgrade. The database URL comes from
# DATABASE_URL (or `-x url=...`), never from this file. Logging goes through the API's
# allowlist formatter (no [loggers] section on purpose).
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
