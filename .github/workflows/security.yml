name: Security

# Dependency, secret and image scans (docs/security.md). Every push, and weekly so that new
# advisories against unchanged code are seen. Gate: no known vulnerability in Python dependencies,
# none of high or critical severity in Node dependencies, no secret, and no fixable high or critical
# finding in the three images.
on:
  push:
  pull_request:
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-deps:
    name: Python dependencies (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [apps/api, apps/mcp, pipelines]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: pip-audit on the locked dependencies
        working-directory: ${{ matrix.suite }}
        run: |
          uv export --frozen --no-hashes --no-emit-project --format requirements-txt > "$RUNNER_TEMP/req.txt"
          uvx pip-audit@2.9.0 -r "$RUNNER_TEMP/req.txt" --progress-spinner off

  node-deps:
    name: Node dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: pnpm audit (high and critical)
        run: pnpm audit --audit-level high

  secrets:
    name: Secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --no-banner --redact -c /repo/.gitleaks.toml

  images:
    name: Images (Trivy, SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          docker build -q -t janus-api:scan -f apps/api/Dockerfile .
          docker build -q -t janus-web:scan -f apps/web/Dockerfile .
          docker build -q -t janus-simulator:scan -f apps/api/simulator.Dockerfile .
      - name: Scan (fixable high and critical fail the job) and write SBOMs
        run: |
          mkdir -p sbom
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/sbom" \
              -v trivy-cache:/root/.cache aquasec/trivy:0.58.1 "$@"
          }
          fail=0
          for img in api web simulator; do
            trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 "janus-$img:scan" || fail=1
            trivy image --quiet --format cyclonedx --output "/sbom/janus-$img.cdx.json" "janus-$img:scan"
          done
          exit "$fail"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom
          path: sbom/
