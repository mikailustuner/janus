name: Model kit PK-Sim load check

# Spec .kiro/specs/model-kit (requirement 4.5, property M25): an exported PK-Sim compound snapshot must load in the
# Open Systems Pharmacology tools, export again unchanged in its identifying fields, and a copy completed with
# test-only values must simulate. Kept out of the main CI like the mrgsolve round trip: it runs only when the model
# kit changes, nightly, and on demand. The export is NOT simulated as exported (the evidence has no physico-chemical
# values); see data/modelkit/README.md.
on:
  push:
    paths:
      - "apps/api/janus/modelkit/export.py"
      - "apps/api/tests/*modelkit*"
      - "apps/api/tests/pksim_roundtrip.R"
      - "apps/api/tests/install_ospsuite.R"
      - "data/modelkit/**"
      - ".github/workflows/modelkit-pksim.yml"
  pull_request:
    paths:
      - "apps/api/janus/modelkit/export.py"
      - "apps/api/tests/*modelkit*"
      - "apps/api/tests/pksim_roundtrip.R"
      - "apps/api/tests/install_ospsuite.R"
      - "data/modelkit/**"
      - ".github/workflows/modelkit-pksim.yml"
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modelkit-pksim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pksim:
    name: PK-Sim loads the export, exports it again, simulates a completed copy
    runs-on: ubuntu-latest
    # The R of the simulator image (apps/api/simulator.Dockerfile): R 4.6.1, CRAN pinned to a dated snapshot.
    container: rocker/r-ver:4.6.1
    timeout-minutes: 60
    env:
      JANUS_REQUIRE_PKSIM: "1"
      HYPOTHESIS_PROFILE: ci
      R_LIBS_USER: ${{ github.workspace }}/.rlib
    steps:
      - uses: actions/checkout@v7
      - name: .NET 8 runtime (PK-Sim core runs on it)
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq dotnet-runtime-8.0 curl
          dotnet --list-runtimes
          dotnet --list-runtimes | grep -q "Microsoft.NETCore.App 8\."
      - name: Cache the R library
        uses: actions/cache@v4
        with:
          path: .rlib
          key: rlib-r4.6.1-ospsuite-12.4.5-rsharp-1.2.3-${{ hashFiles('apps/api/tests/install_ospsuite.R') }}
      - name: Install ospsuite (pinned) and its dependencies
        run: Rscript apps/api/tests/install_ospsuite.R
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: apps/api
          enable-cache: true
      - name: Load, export again, simulate a completed copy
        working-directory: apps/api
        # No database here; the CI-only rule that database tests must not skip (tests/conftest.py, DP19) belongs
        # to the main API job.
        env:
          CI: "false"
        run: |
          uv sync --frozen
          uv run pytest -m pksim tests/test_modelkit_export.py -q
