name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: .kiro/ must be tracked and not gitignored
        run: |
          if git check-ignore -q .kiro || git check-ignore -q .kiro/steering/product.md; then
            echo "::error::.kiro/ is ignored by git. It must be committed."
            exit 1
          fi
          if [ -z "$(git ls-files .kiro)" ]; then
            echo "::error::No files under .kiro/ are tracked."
            exit 1
          fi

      - name: No TİTCK list files tracked
        run: |
          tracked="$(git ls-files -- data docs | grep -iE 'titck|tİtck' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::TİTCK list files must not be committed (unclear redistribution terms):"
            echo "$tracked"
            exit 1
          fi

      - name: No private planning documents tracked (docs/internal/)
        run: |
          tracked="$(git ls-files -- docs/internal)"
          if [ -n "$tracked" ]; then
            echo "::error::Files under docs/internal/ are private and must not be committed:"
            echo "$tracked"
            exit 1
          fi

      - name: Deploy compose file keeps its hardening (deploy C1)
        run: |
          # Secrets are files next to the compose file: dummy ones in a temp stack directory.
          stack="$(mktemp -d)"
          mkdir "$stack/secrets"
          for n in postgres_password database_url noise_key simulator_db_password simulator_database_url; do
            echo x > "$stack/secrets/$n"
          done
          cp deploy/compose.yml "$stack/compose.yml"
          JANUS_UID=1000 JANUS_GID=1000 JANUS_TAG=ci \
            docker compose --project-directory "$stack" -f "$stack/compose.yml" --profile migrate config --format json \
            | python3 deploy/check_compose.py
          # The same file as the staging stack.
          JANUS_STACK=janus-staging JANUS_NET_INTERNAL=172.31.254.0/24 JANUS_NET_EDGE=172.31.253.0/24 \
            JANUS_UID=1000 JANUS_GID=1000 JANUS_TAG=ci \
            docker compose --project-directory "$stack" -f "$stack/compose.yml" --profile migrate config --format json \
            | python3 deploy/check_compose.py

      - name: Deploy scripts pass shellcheck
        run: shellcheck -x -P deploy deploy/*.sh

      - name: API image starts outside the repository layout (deploy task 1)
        run: |
          docker build -q -t janus-api:ci -f apps/api/Dockerfile .
          docker run -d --name api-ci --read-only --tmpfs /tmp --user 10001 janus-api:ci
          for i in $(seq 1 30); do
            docker exec api-ci python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=2)" 2>/dev/null && break
            sleep 1
          done
          docker exec api-ci python -c "
          import urllib.request as u
          for path in ('/health', '/seance/catalogue'):
              assert u.urlopen('http://127.0.0.1:8000' + path, timeout=5).status == 200, path
          " || { docker logs api-ci | tail -20; exit 1; }
          docker rm -f api-ci

      - name: Simulator image builds (amd64) and runs its self-test hardened (simulation-service Req 4)
        run: |
          docker build -q -t janus-simulator:ci -f apps/api/simulator.Dockerfile .
          docker run --rm --read-only --tmpfs /tmp:size=256m,noexec,nosuid,nodev --user 10002 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true --network none --cpus 2 --memory 1536m \
            janus-simulator:ci python -m janus.simulation.worker --selftest

      - name: Pipelines image keeps the repository layout (deploy task 8)
        run: |
          docker build -q -t janus-pipelines:ci -f deploy/pipelines.Dockerfile pipelines
          docker run --rm --read-only --tmpfs /tmp -e HOME=/tmp --entrypoint python janus-pipelines:ci -c "
          from janus_pipelines.cli import REPO_ROOT, registry_path
          from janus_pipelines.core.registry import load_registry
          assert str(REPO_ROOT) == '/repo', REPO_ROOT
          load_registry(registry_path(REPO_ROOT))
          "

  web:
    name: Web (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests with the core-module coverage floors (docs/testing.md)
        run: pnpm --filter @janus/web test:coverage

  web-e2e:
    name: Web (Playwright, en + tr)
    runs-on: ubuntu-latest
    # Owner decision 2026-11-08: smoke and the axe / 375 px route checks for en and tr in both
    # themes on the production build; the full five-language matrix runs locally.
    env:
      E2E_LOCALES: en,tr
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @janus/web exec playwright install --with-deps chromium
      - run: pnpm --filter @janus/web build
      - run: pnpm --filter @janus/web exec playwright test e2e/smoke.spec.ts e2e/routes.spec.ts --project=phone

  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: janus_test
          POSTGRES_USER: janus
          POSTGRES_PASSWORD: janus-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U janus -d janus_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HYPOTHESIS_PROFILE: ci
      # Throwaway CI service container; not a secret.
      JANUS_TEST_DATABASE_URL: postgresql://janus:janus-ci-only@127.0.0.1:5432/janus_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: apps/api
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Postgres logs no statements or failing rows (same settings as docker-compose.yml)
        run: |
          for setting in "log_error_verbosity = 'terse'" "log_min_error_statement = 'panic'" \
                         "log_statement = 'none'" "log_min_duration_statement = -1"; do
            psql "$JANUS_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET $setting"
          done
          psql "$JANUS_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT pg_reload_conf()"
      - name: Apply migrations
        run: uv run alembic -x url="$JANUS_TEST_DATABASE_URL" upgrade head
      - run: uv run pytest --cov --cov-report=json:coverage.json --cov-report=term:skip-covered
      - name: Core modules keep at least 90 % line coverage (docs/testing.md)
        run: >-
          python3 ../../scripts/coverage_gate.py coverage.json
          janus/cascades=90 janus/resolution=90 janus/notes=90 janus/modelkit=90

  mcp:
    name: MCP server (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: apps/mcp
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  pipelines:
    name: Pipelines (lint, types, tests, NOTICE)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: pipelines
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest --cov=janus_pipelines --cov-report=json:coverage.json --cov-report=
      - name: Model kit pipeline coverage does not fall (floor raised to 90 % in phase C2)
        run: python3 ../scripts/coverage_gate.py coverage.json janus_pipelines/modelkit=84
      - name: NOTICE is generated from sources.toml
        run: uv run janus-pipelines notice --check
