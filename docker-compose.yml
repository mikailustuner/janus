# Local development only. Nothing here is a deployment configuration.
# Usage: cp .env.example .env  (set POSTGRES_PASSWORD), then: docker compose up --build
name: janus

services:
  postgres:
    image: postgres:16
    # No statement text, parameters or failing rows in the server log (privacy.md):
    # a CHECK violation would otherwise print the whole row in DETAIL.
    command:
      - postgres
      - -c
      - log_error_verbosity=terse
      - -c
      - log_min_error_statement=panic
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
    environment:
      POSTGRES_DB: janus
      POSTGRES_USER: janus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janus -d janus"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    # One-shot: apply Alembic migrations (forward-only; each has a downgrade).
    build:
      context: apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://janus:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/janus
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: apps/api
    environment:
      DATABASE_URL: postgresql://janus:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/janus
      # Donations stay disabled unless these are set in .env (`local` for development).
      JANUS_DONATION_REGION: ${JANUS_DONATION_REGION:-}
      JANUS_CONSENT_VERSIONS: ${JANUS_CONSENT_VERSIONS:-}
      JANUS_K: ${JANUS_K:-20}
      JANUS_DP_EPSILON: ${JANUS_DP_EPSILON:-1}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Same-origin API: the web server maps /api/* to this address (experience DP15).
        JANUS_API_ORIGIN: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"

volumes:
  pgdata:
