<title id="t">Model kit precision: risk-coverage curve</title>
<desc id="d">Precision of confirmed values at each strict-check level against the share of confirmed values kept, per source, with cluster-aware 95 % intervals. Truth is two automated review passes; expert review has not yet been done.</desc>
