<text x="604.0" y="362" text-anchor="middle" fill="#374151">100 %</text>
<line x1="64" x2="604" y1="59.6" y2="59.6" stroke="#6b7280" stroke-dasharray="5 4"/><text x="604" y="54.6" text-anchor="end" fill="#374151">acceptance bound 0.90</text>
