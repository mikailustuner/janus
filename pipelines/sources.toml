# Source registry: every data source Janus uses or cites (design §3.4, Req 3).
# NOTICE is generated from this file: `uv run janus-pipelines notice`. Edit here, not in NOTICE.
#
# storage: runtime_only (fetch at runtime, never commit) | cache (may be stored outside git)
#          | commit (may be committed under data/) | separate_package (own licence package)
#          | cited_only (not ingested or redistributed)
# region: TR | EU | US, or omitted.  cadence_days: expected update interval.

[notice]
header = """
Janus
Copyright 2026 Mikail Üstüner

This product's source code is licensed under the Apache License, Version 2.0
(see LICENSE).

Janus is a research prototype, not a medical device. It provides information,
not medical advice.

--------------------------------------------------------------------------------
THIRD-PARTY DATA SOURCES
--------------------------------------------------------------------------------

Janus uses the data sources below. Each keeps its own license or terms; the
Apache-2.0 license of the code does not apply to them. Every record Janus
stores from these sources keeps its source URL, license, region and snapshot
date. Use of a source does not imply endorsement by its publisher.

This file is generated from pipelines/sources.toml by `janus-pipelines notice`.
Do not edit it by hand. Snapshot dates of data fetched at runtime are shown with
each result in the product, not here.
"""

