[project]
name = "janus-pipelines"
version = "0.0.0"
description = "Janus data pipelines (research prototype, not a medical device)"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "httpx2>=2.16.0",
    "openpyxl>=3.1.5",
    "polars>=1.0",
    "pydantic>=2.14.3",
]

[project.scripts]
janus-pipelines = "janus_pipelines.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-defusedxml>=0.7.0.20260504",
    "types-openpyxl>=3.1.5.20261017",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["janus_pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "RUF"]
# Turkish source text uses dotless i and dotted capital I on purpose.
allowed-confusables = ["ı", "İ", "–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["janus_pipelines", "tests"]
venvPath = "."
venv = ".venv"
